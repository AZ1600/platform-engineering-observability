name: Validate Observability Configuration

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: observability-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI secret fixtures
        run: |
          mkdir -p .secrets
          printf '%s' \
            'https://example.invalid/slack-webhook' \
            > .secrets/slack_webhook_url

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          echo "Docker Compose configuration valid"

      - name: Build demo API image
        run: |
          docker compose build demo-api

      - name: Validate Python application
        run: |
          python3 -m compileall -q app
          echo "Python application syntax valid"

      - name: Validate Prometheus configuration and rules
        run: |
          docker compose run --rm --no-deps \
            --entrypoint /bin/promtool \
            prometheus \
            check config /etc/prometheus/prometheus.yml

      - name: Test Prometheus rules
        run: |
          docker compose run --rm --no-deps \
            --entrypoint /bin/promtool \
            prometheus \
            test rules /etc/prometheus/tests/rules.test.yml

      - name: Validate Alertmanager configuration
        run: |
          docker compose run --rm --no-deps \
            --entrypoint /bin/amtool \
            alertmanager \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard JSON
        run: |
          set -e

          for dashboard in grafana/dashboards/*.json; do
            echo "Validating ${dashboard}"
            python3 -m json.tool "${dashboard}" > /dev/null
          done

          echo "Grafana dashboard JSON valid"
  smoke-test:
    name: End-to-end smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI secret fixtures
        run: |
          mkdir -p .secrets
          printf '%s' \
            'https://example.invalid/slack-webhook' \
            > .secrets/slack_webhook_url

      - name: Start observability stack
        run: docker compose up -d --build

      - name: Run end-to-end smoke test
        run: ./scripts/observability-smoke.sh

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop observability stack
        if: always()
        run: docker compose down --volumes