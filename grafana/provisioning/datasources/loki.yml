apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

    isDefault: false
    editable: false

    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: tempo

          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'

          url: '$${__value.raw}'
          urlDisplayLabel: 'View Trace'